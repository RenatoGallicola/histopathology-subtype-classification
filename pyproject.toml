[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "histopathology-subtype-classification"
version = "1.0.0"
description = "Molecular subtype classification from whole-slide images — AN2DL 2025/26 Challenge 2"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Alessandro Zanoni" },
    { name = "Jacopo Valentini" },
    { name = "Arianna Balducci" },
    { name = "Renato Gallicola" },
]
keywords = ["histopathology", "whole-slide-imaging", "multiple-instance-learning",
            "foundation-models", "pytorch", "ensemble"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
train = ["torch>=2.1", "torchvision>=0.16", "timm>=1.0", "huggingface-hub>=0.23",
         "opencv-python>=4.8", "Pillow>=10.0", "albumentations>=1.4", "tqdm>=4.66"]
dev = ["pytest>=7.4", "torch>=2.1", "torchvision>=0.16"]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]
